<form #registerForm="ngForm" (ngSubmit)="onSubmit(registerForm)">
    <div class="forgot-password">
        <label class="emailGrp" for="emailId">Email Id</label>
        <div style="display: flex; align-items: center; gap: 10px;">
            <input type="text" id="emailId" name="emailId" autocomplete="off" [(ngModel)]="userData.emailId"
                [disabled]="isEnableQues" required />
            <button type="button" (click)="verifyEmail()" style="cursor:pointer; margin-bottom: 16px;" [disabled]="isEnableQues">✔</button>
        </div>

        <!-- Security Question & Answer -->
        <div *ngIf="isEnableQues">
            <div class="ques">
                <label for="questions">Question</label>
                <input type="text" name="questions" [(ngModel)]="questions" [disabled]="true">
            </div>

            <div class="ans">
                <label for="answer">Answer</label>
                <textarea rows="5" style="min-width: 420px;" [(ngModel)]="userData.answer" name="answer"
                    [disabled]="answer" required></textarea>

                <div *ngIf="registerForm.controls['answer']?.invalid && registerForm.controls['answer']?.touched"
                    style="color:red;">
                    Answer is required.
                </div>
            </div>

            <div *ngIf="firstSubmit" class="button-group">
                <button type="submit">Submit</button>
                <button routerLink="/login_page">Cancel</button>
            </div>
        </div>

        <!-- Password Reset Section -->
        <div *ngIf="quesAns">
            <label for="newPassword">New Password</label>
            <div class="password-wrapper">
                <input [type]="showPassword ? 'text' : 'password'" class="pst" [(ngModel)]="userData.newPassword" id="newPassword"
                    name="newPassword" #newPassword="ngModel" autocomplete="new-password" required />
            </div>
            <div class="errSty" *ngIf="newPassword.invalid && newPassword.touched" style="color: red; font-size: 14px;">
                <div *ngIf="newPassword.errors?.['required']">Password is required.</div>
                <div *ngIf="passwordErrors.uppercase">Must contain at least 1 uppercase letter.</div>
                <div *ngIf="passwordErrors.specialChar">Must contain at least 1 special symbol (!@#$%^&* etc.)</div>
                <div *ngIf="passwordErrors.minLength">Must be at least 8 characters long.</div>
            </div>


            <label for="confirmPassword">Confirm Password</label>
            <input type="password" [(ngModel)]="userData.confirmPassword" id="confirmPassword" name="confirmPassword"
                #confirmPassword="ngModel" required />

            <div *ngIf="confirmPassword.invalid && confirmPassword.touched" style="color: red; font-size: 14px;">
                <div *ngIf="confirmPassword.errors?.['required']">Confirm Password is required.</div>
            </div>

            <div *ngIf="userData.newPassword && userData.confirmPassword && userData.newPassword !== userData.confirmPassword"
                style="color: red; font-size: 14px;">
                Passwords do not match.
            </div>

            <div class="button-group">
                <button type="button" (click)="submit(registerForm)">Submit</button>
                <button routerLink="/login_page">Cancel</button>
            </div>
        </div>
    </div>
</form>
