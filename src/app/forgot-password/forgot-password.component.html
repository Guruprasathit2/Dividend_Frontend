<form #registerForm="ngForm" (ngSubmit)="onSubmit(registerForm)">
    <div class="forgot-password">
        <label class="emailGrp" for="emailId">Email Id</label>
        <div style="display: flex; align-items: center; gap: 10px;">
            <input type="text" id="emailId" name="emailId" autocomplete="off" [(ngModel)]="userData.emailId" required />
            <button type="button" (click)="verifyEmail()" style="cursor:pointer; margin-bottom: 16px;">✔</button>
        </div>
        <div *ngIf="isEnableQues">
            <div class="ques">
                <label for="questions">Question</label>
                <input type="text" name="questions" [(ngModel)]="questions">
            </div>
            <div class="ans">
                <label for="answer">Answer</label>
                <textarea rows="5" style="min-width: 420px;" [(ngModel)]="userData.answer" name="answer"
                    required></textarea>
                <div *ngIf="registerForm.controls['answer']?.invalid && registerForm.controls['answer']?.touched"
                    style="color:red;">
                    Answer is required.
                </div>
            </div>
        </div>
        <div class="button-group">
            <button type="submit">Submit</button>
        </div>
    </div>
</form>
