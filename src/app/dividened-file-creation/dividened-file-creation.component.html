<form id="dividened" #fileForm="ngForm">
    <div class="form-card">
      <h2 class="form-title">Dividend File Creation</h2>
      <div class="row">
        <div class="column">
          <label>Company Name</label>
          <select [(ngModel)]="formData.shortName" name="shortName" [disabled]="nsdlEdit && cdslEdit">
            <option value="" hidden>Select company</option>
            <option *ngFor="let c of cmpData" [value]="c.Cmp_Shrt_Nm">{{c.Cmp_Nm}}</option>
          </select>
        </div>
        <div class="column">
          <label>Record Date</label>
          <input type="text" [(ngModel)]="formData.recordDate" name="recordDate" placeholder="DD/MM/YYYY"
            [disabled]="nsdlEdit" />
        </div>
      </div>
  
      <div class="row">
        <div class="column">
          <label>NSDL Date</label>
          <div class="inline-input">
            <input type="text" [(ngModel)]="formData.nsdlDate" name="nsdlDate" placeholder="DD/MM/YYYY"
              [disabled]="nsdlEdit" />
            <button type="button" (click)="DateCheck(formData, 1)" [disabled]="nsdlEdit">Verify</button>
          </div>
        </div>
        <div class="column">
          <label>CDSL Date</label>
          <div class="inline-input">
            <input type="text" [(ngModel)]="formData.cdslDate" name="cdslDate" placeholder="DD/MM/YYYY"
              [disabled]="cdslEdit" />
            <button type="button" (click)="DateCheck(formData, 0)" [disabled]="cdslEdit">Verify</button>
          </div>
        </div>
      </div>
  
      <div class="row">
        <div class="column">
          <label>Bank</label>
          <select [(ngModel)]="formData.bankName" name="bankName" (click)="onChange(formData.bankName)" [disabled]="idEdit">
            <option value="" hidden>Select Bank</option>
            <option *ngFor="let b of bankData" [value]="b.BankName">{{b.BankName}}</option>
          </select>
        </div>
        <div class="column">
          <label>Account no</label>
          <input type="number" [(ngModel)]="formData.accNo" name="accNo" [readonly]="idEdit" placeholder="e.g., 864297531" />
        </div>
      </div>
  
      <div class="row">
        <div class="column">
          <label>DIV Year</label>
          <input type="number" [(ngModel)]="formData.divYear" name="divYear" placeholder="e.g., 2025" [readonly]="idEdit" />
        </div>
        <div class="column">
          <label>DIV per share</label>
          <input type="number" [(ngModel)]="formData.divPerShare" name="divPerShare" step="0.01"
            placeholder="e.g., 12.50" [readonly]="idEdit" />
        </div>
      </div>
  
      <div class="row">
        <div class="column">
          <label>DIV percentage</label>
          <input type="number" [(ngModel)]="formData.divpercentage" name="divpercentage" placeholder="e.g., 30"
            [readonly]="idEdit" />
        </div>
        <div class="column">
          <label>WRN Date</label>
          <input type="text" [(ngModel)]="formData.wrnDate" name="wrnDate" placeholder="DD/MM/YYYY" [readonly]="idEdit" />
        </div>
      </div>
  
      <div class="row">
        <div class="column">
          <label>Financial year from</label>
          <input type="date" [(ngModel)]="formData.finFrom" name="finFrom" [min]="minDate" [max]="maxDate"
            [readonly]="idEdit" />
        </div>
        <div class="column">
          <label>Financial year to</label>
          <input type="date" [(ngModel)]="formData.finTo" name="finto" [min]="secMin" [max]="maxDate"
            [readonly]="idEdit" [disabled]="!formData.finFrom" (click)="endDate()" />
        </div>
      </div>
  
      <div class="BTN">
        <button *ngIf="updatedit" type="button" class="btn-primary" (click)="idEdit ? update(1) : update(2)">
          {{idEdit ? 'Do you want to update' : 'Update'}}
          <span *ngIf="isLoading" class="loader"></span>
        </button>
        <button *ngIf="!updatedit" type="button" class="btn-primary" (click)="Add()">Add
          <span *ngIf="isLoading" class="loader"></span>
        </button>
        <button type="button" class="btn-secondary" routerLink="/home_page">Exit</button>
      </div>
    </div>
  </form>
